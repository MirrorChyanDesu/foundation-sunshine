name: Validate MirrorChyan review fixes
'on':
  push:
    branches:
    - codex/foundation-release-review-20261031
  workflow_dispatch: null
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: 24
    - run: node --test .github/tests/mirrorchyan-review.test.cjs
  metadata:
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        include:
        - tag: v2026.1029.95137.杂鱼
          channel: stable
        - tag: v2026.1029.22241.杂鱼
          channel: beta
    steps:
    - name: Resolve release and wait for installer
      id: upload_release
      uses: actions/github-script@v7
      env:
        RELEASE_TAG: ${{ matrix.tag }}
      with:
        script: |
          const target = { owner: 'AlkaidLab', repo: 'foundation-sunshine' };
          let release;
          if (process.env.RELEASE_TAG) {
            release = (await github.rest.repos.getReleaseByTag({ ...target, tag: process.env.RELEASE_TAG })).data;
          } else {
            const { data } = await github.rest.repos.listReleases({ ...target, per_page: 100 });
            release = data.find(item => !item.draft);
          }
          if (!release || release.draft) {
            throw new Error('No published release found');
          }

          // published can arrive before the release action finishes uploading assets.
          for (let attempt = 0; attempt < 40; attempt++) {
            const ready = release.assets.some(asset =>
              /^Sunshine.*Installer.*\.exe$/.test(asset.name) && asset.state === 'uploaded');
            if (ready) {
              core.setOutput('tag', release.tag_name);
              core.setOutput('channel', release.prerelease ? 'beta' : 'stable');
              return;
            }
            if (attempt === 39) {
              throw new Error('Installer was not ready within 10 minutes');
            }
            core.info(`Waiting for installer assets (${attempt + 1}/40)`);
            await new Promise(resolve => setTimeout(resolve, 15000));
            release = (await github.rest.repos.getRelease({ ...target, release_id: release.id })).data;
          }
    - name: Resolve release channel
      id: note_release
      uses: actions/github-script@v7
      env:
        RELEASE_TAG: ${{ matrix.tag }}
      with:
        script: |
          const target = { owner: 'AlkaidLab', repo: 'foundation-sunshine' };
          let release;
          if (process.env.RELEASE_TAG) {
            release = (await github.rest.repos.getReleaseByTag({ ...target, tag: process.env.RELEASE_TAG })).data;
          } else {
            const { data } = await github.rest.repos.listReleases({ ...target, per_page: 100 });
            release = data.find(item => !item.draft);
          }
          if (!release || release.draft) {
            throw new Error('No published release found');
          }
          core.setOutput('tag', release.tag_name);
          core.setOutput('channel', release.prerelease ? 'beta' : 'stable');
    - name: Verify release tags and channels
      uses: actions/github-script@v7
      env:
        UPLOAD_TAG: ${{ steps.upload_release.outputs.tag }}
        UPLOAD_CHANNEL: ${{ steps.upload_release.outputs.channel }}
        NOTE_TAG: ${{ steps.note_release.outputs.tag }}
        NOTE_CHANNEL: ${{ steps.note_release.outputs.channel }}
        EXPECTED_TAG: ${{ matrix.tag }}
        EXPECTED_CHANNEL: ${{ matrix.channel }}
      with:
        script: |
          for (const prefix of ['UPLOAD', 'NOTE']) {
            if (process.env[`${prefix}_TAG`] !== process.env.EXPECTED_TAG ||
                process.env[`${prefix}_CHANNEL`] !== process.env.EXPECTED_CHANNEL) {
              throw new Error(`${prefix} tag/channel did not match the GitHub release state`);
            }
          }
          core.info(`Verified ${process.env.EXPECTED_TAG}: ${process.env.EXPECTED_CHANNEL}`);
